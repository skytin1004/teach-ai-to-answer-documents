<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Local open-source RAG tutorial pipeline</title>
  <desc id="desc">An end-to-end local RAG workflow with Markdown documents, chunking, local embeddings, Qdrant vector storage, retrieval, reranking, and Ollama generation.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#091827"/>
      <stop offset=".55" stop-color="#102d45"/>
      <stop offset="1" stop-color="#0c3a3b"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eaf6ff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#2bd6c4" flood-opacity=".35"/>
    </filter>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000000" flood-opacity=".22"/>
    </filter>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8fcfe5"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg2)"/>
  <g opacity=".18" stroke="#9bd7ea" stroke-width="1">
    <path d="M0 170 H1600"/>
    <path d="M0 310 H1600"/>
    <path d="M0 450 H1600"/>
    <path d="M0 590 H1600"/>
    <path d="M0 730 H1600"/>
    <path d="M160 0 V900"/>
    <path d="M320 0 V900"/>
    <path d="M480 0 V900"/>
    <path d="M640 0 V900"/>
    <path d="M800 0 V900"/>
    <path d="M960 0 V900"/>
    <path d="M1120 0 V900"/>
    <path d="M1280 0 V900"/>
    <path d="M1440 0 V900"/>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="88" y="96" font-size="44" font-weight="750" fill="#ffffff">Series 2: Local Open-Source RAG</text>
    <text x="90" y="140" font-size="22" fill="#b7d8e5">Markdown → chunks → embeddings → Qdrant → reranking → grounded answer</text>
  </g>

  <g filter="url(#shadow2)">
    <rect x="85" y="250" width="235" height="260" rx="18" fill="url(#panel)"/>
    <rect x="115" y="290" width="170" height="38" rx="8" fill="#123653"/>
    <path d="M120 365 H280 M120 398 H250 M120 431 H270" stroke="#62a9c9" stroke-width="10" stroke-linecap="round"/>
    <rect x="126" y="455" width="116" height="26" rx="13" fill="#dff7ef"/>
    <text x="116" y="560" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" fill="#d5edf6">Local docs</text>
  </g>

  <path d="M335 380 H430" stroke="#8fcfe5" stroke-width="4" marker-end="url(#arrow2)"/>

  <g filter="url(#shadow2)">
    <rect x="455" y="235" width="245" height="290" rx="18" fill="#ffffff"/>
    <g fill="#e9f7ff" stroke="#3996c7" stroke-width="2">
      <rect x="492" y="275" width="160" height="48" rx="8"/>
