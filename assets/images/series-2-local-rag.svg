    <rect x="835" y="235" width="260" height="290" rx="18" fill="#102f47" stroke="#3ac7c1" stroke-width="2"/>
    <g stroke="#2bd6c4" stroke-width="3" opacity=".9">
      <path d="M900 348 L960 303 L1030 342 L990 413 L910 400 Z" fill="none"/>
