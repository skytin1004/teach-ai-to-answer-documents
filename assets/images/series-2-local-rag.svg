    <ellipse cx="1348" cy="292" rx="96" ry="30" fill="#dff4ff" stroke="#2484b4" stroke-width="3"/>
    <path d="M1252 292 V430 C1252 447 1295 462 1348 462 C1401 462 1444 447 1444 430 V292" fill="#f6fcff" stroke="#2484b4" stroke-width="3"/>
    <ellipse cx="1348" cy="430" rx="96" ry="30" fill="#e3f8ed" stroke="#2484b4" stroke-width="3"/>
    <g fill="#1db886">
