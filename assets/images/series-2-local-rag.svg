      <circle cx="1348" cy="328" r="6"/>
      <circle cx="1394" cy="365" r="6"/>
      <circle cx="1325" cy="404" r="6"/>
      <circle cx="1380" cy="413" r="6"/>
    </g>
    <text x="1244" y="575" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" fill="#d5edf6">Vector store + payload</text>
  </g>

  <g filter="url(#shadow2)">
    <rect x="500" y="665" width="610" height="105" rx="22" fill="#ffffff"/>
    <path d="M548 705 H1018 M548 738 H880" stroke="#6aa9c8" stroke-width="10" stroke-linecap="round"/>
    <rect x="920" y="723" width="70" height="28" rx="14" fill="#dff7ef"/>
    <rect x="1000" y="723" width="70" height="28" rx="14" fill="#e5f0ff"/>
    <text x="550" y="825" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" fill="#d5edf6">Grounded answer with source references</text>
  </g>

  <path d="M1350 545 C1350 650 1110 655 1060 690" stroke="#8fcfe5" stroke-width="4" fill="none" marker-end="url(#arrow2)"/>
  <path d="M805 650 C805 610 935 610 965 545" stroke="#8fcfe5" stroke-width="4" fill="none" marker-end="url(#arrow2)"/>

  <g filter="url(#shadow2)">
    <rect x="1150" y="650" width="255" height="125" rx="18" fill="#0d2438" stroke="#2bd6c4" stroke-width="2"/>
    <rect x="1180" y="682" width="195" height="16" rx="8" fill="#5bbdd7"/>
    <rect x="1180" y="715" width="150" height="16" rx="8" fill="#99dfc6"/>
    <rect x="1180" y="748" width="105" height="16" rx="8" fill="#6faecc"/>
    <text x="1172" y="825" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" fill="#d5edf6">Optional local LLM</text>
  </g>
</svg>
